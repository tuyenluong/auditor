openapi: 3.0.3
info:
  title: Orders
  version: "1.0.0"
paths:
  /orders/{id}:
    get:
      responses:
        "200":
          description: An order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    Order:
      type: object
      properties:
        sku:
          type: string
