openapi: 3.0.3
info:
  title: Orders API
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:3000
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sku
                - qty
              properties:
                sku:
                  type: string
                qty:
                  type: integer
                note:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    get:
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrder
      responses:
        "200":
          description: An order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
components:
  schemas:
    Order:
      type: object
      required:
        - id
        - sku
        - qty
        - status
      properties:
        id:
          type: string
        sku:
          type: string
        qty:
          type: integer
        status:
          type: string
          enum:
            - pending
            - shipped
        note:
          type: string
